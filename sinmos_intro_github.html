<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>sinmos游戏介绍</title>
        <link rel="stylesheet" href="sinmos_intro_style.css">
        <link rel="stylesheet" href="button_type_a.css">
    </head>
    <body>
        <div class="body_container">
            <a href="index.html" class="a_button">回到主页</a>
            <div class="gameplay">
                <div class="title">
                    <h2>【游戏玩法介绍】</h2>
                </div>
                <div class="play_intro">
                    <p>
                        sinmos的音游玩法是参考了数学中的“图”(graph)的玩法<br>
                        通过不同的函数引导音符落在判定线(也是函数)上面<br>
                        在音符到达判定线上面的时候就按下<s>键来了就按</s><br>
                        目标是<s>糊上去</s>尽可能拿到高准确率<br>
                    </p>
                </div>

                <div class="gameidea">
                    <div class="title">
                        <h2>【游戏构思】</h2>
                    </div>
                    <div class="idea_intro">
                        <p>
                            在很早的时候，就梦想有一天能做属于自己的游戏<br>
                            这个游戏是由小宫在某天复习M2(一个有关微积分的科目)<del>因为读崩溃了在脑子里想到的</del>灵光一现想到的<br>
                            而游戏剧情是在考DSE期间复习物理的E1<s>因为读傻了想到的</s>有了灵感而想到的<br>
                            在考完DSE后，就有很多时间去完善这个游戏企划<br>
                        </p>          
                    </div>
                </div>
                
                <div class="gamedevelopment">
                    <div class="title">
                        <h2>【游戏开发历程】</h2>
                    </div>
                    <div class="development_intro">
                        请移步到<a class="a_button">游戏开发历程</a>去继续阅读
                    </div>
                </div>

            </div>
        </div>
    </body>
</html>
